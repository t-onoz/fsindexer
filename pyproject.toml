[project]
name = "fsindexer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "t-onoz", email = "18749921+t-onoz@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fsspec>=2026.6.0",
]

[project.scripts]
fsindexer = "fsindexer:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = [
    ".",
    ".",
]

[tool.uv.sources]
fsindexer = { workspace = true, editable = true }

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignore = true

[dependency-groups]
dev = [
    "fsindexer",
    "ipykernel>=7.3.0",
    "pip>=26.1.2",
    "polars>=1.43.0",
]
